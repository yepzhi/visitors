<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors ✨ — Yepzhi.com Unified Analytics</title>
    <meta name="description"
        content="Metametría unificada para todo el ecosistema yepzhi.com. Seguimiento en tiempo real de visitantes globales.">
    <meta name="theme-color" content="#050510">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=2.0">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
</head>

<body class="visitors-page">

    <!-- PARTICLE CANVAS -->
    <canvas id="particle-canvas"></canvas>

    <!-- NAVIGATION (Glass Pill) -->
    <nav id="main-nav">
        <a href="index.html" class="nav-logo">
            <span style="font-size: 1.2rem;">📍</span> 
            <span>NETWØRK METRICS</span>
        </a>
        <div class="nav-links">
            <select id="site-filter" class="site-dropdown">
                <option value="all">Global Ecosystem</option>
                <option value="neosys">Neosys Aeon</option>
                <option value="jovenesstem">JovenesSTEM</option>
                <option value="hopradio">HopRadio</option>
                <option value="sergradio">SERGRadio</option>
            </select>
        </div>
    </nav>

    <!-- ═══════════════════════════════════════════
         COMMAND CENTER HERO (Map + HUD)
         ═══════════════════════════════════════════ -->
    <main class="command-center container">
        
        <div class="map-viewport reveal">
            <!-- THE MAP -->
            <div id="visitor-map"></div>

            <!-- FLOATING HUD -->
            <div class="hud-container">
                <div class="hud-left">
                    <div class="hud-card">
                        <h3>Impressions</h3>
                        <span id="stat-total-views" class="stat-value">0</span>
                    </div>
                    <div class="hud-card">
                        <h3>Geographies</h3>
                        <span id="stat-total-countries" class="stat-value">0</span>
                    </div>
                    <div class="hud-card">
                        <h3>Active Nodes</h3>
                        <span id="stat-total-cities" class="stat-value">0</span>
                    </div>
                </div>

                <div class="hud-right">
                    <div class="map-status">
                        <div id="overlay-site-name" class="status-site">GLOBAL TRAFFIC</div>
                        <div id="overlay-last-visit" class="status-time">Pulse: OK</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DETAILED ACTIVITY -->
        <section class="activity-section reveal">
            <div class="glass-panel">
                <h3 class="subsection-title">Node Activity Feed</h3>
                
                <div style="overflow-x: auto;">
                    <table id="visitors-table">
                        <thead>
                            <tr>
                                <th>Source Node</th>
                                <th>Geographic Origin</th>
                                <th>Resource Path</th>
                                <th>Acquisition</th>
                                <th>Timestamp (UTC)</th>
                            </tr>
                        </thead>
                        <tbody id="visitors-tbody">
                            <!-- Data injected via app.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- ═══════════════════════════════════════════
         FOOTER
         ═══════════════════════════════════════════ -->
    <footer class="footer" style="padding: 40px 0; border-top: 1px solid var(--glass-border); margin-top: 60px;">
        <div class="container text-center">
            <p style="opacity: 0.4; font-size: 0.75rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em;">
                Visitors Unified Analytics — Build 4.7.4
            </p>
            <p class="text-accent" style="font-weight: 800; font-size: 0.8rem; margin-top: 8px;">#ThinkWithEvidence</p>
        </div>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Dashboard Logic -->
    <script src="app.js?v=2.0"></script>
</body>

</html>
